[build]
  command = "npm run build"
  publish = "dist"
  # Each production deploy costs Netlify credits. Skip the build when nothing
  # in the storefront changed (exit 0 = skip, 1 = build).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
